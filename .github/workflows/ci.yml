name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn -B verify

  migration:
    name: MySQL Flyway migration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: garment_erp
          MYSQL_USER: garment
          MYSQL_PASSWORD: garment
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply baseline migration
        run: >-
          mvn -B flyway:migrate
          -Dflyway.url=jdbc:mysql://127.0.0.1:3306/garment_erp
          -Dflyway.user=garment
          -Dflyway.password=garment
      - name: Verify migrated schema
        run: |
          mysql -h 127.0.0.1 -ugarment -pgarment -e \
            "SELECT installed_rank, version, description, success FROM garment_erp.flyway_schema_history"
          tables=$(mysql -h 127.0.0.1 -ugarment -pgarment -N -B -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='garment_erp'")
          echo "Migrated tables: $tables"
          test "$tables" -ge 56
          failed=$(mysql -h 127.0.0.1 -ugarment -pgarment -N -B -e \
            "SELECT COUNT(*) FROM garment_erp.flyway_schema_history WHERE success = 0")
          test "$failed" -eq 0
      - name: Validate schema with Hibernate
        env:
          SPRING_PROFILES_ACTIVE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: garment_erp
          DB_USER: garment
          DB_PASSWORD: garment
          JWT_SECRET: ci-mysql-validation-secret-0123456789
          CORS_ORIGINS: http://localhost:5173
          DEMO_DATA: 'false'
          BACKUP_ENABLED: 'false'
        run: |
          nohup mvn -B spring-boot:run -Dspring-boot.run.arguments=--server.port=8081 \
            > /tmp/mysql-app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8081/actuator/health/readiness | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          tail -100 /tmp/mysql-app.log
          exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: backend
        run: nohup mvn -B spring-boot:run > /tmp/backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          tail -100 /tmp/backend.log
          exit 1
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: garment-erp-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: garment-erp-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
