spring:
  application:
    name: garment-erp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

app:
  jwt:
    # Required in production. The local and test profiles supply a development-only fallback.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    issuer: garment-erp
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  security:
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX:30}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
  uploads-dir: ${UPLOADS_DIR:./data/uploads}
  backups-dir: ${BACKUPS_DIR:./data/backups}
  demo-data: ${DEMO_DATA:false}
  seed-password: ${SEED_PASSWORD:Retail@123}
  notification:
    whatsapp:
      provider: ${WHATSAPP_PROVIDER:disabled}
      api-url: ${WHATSAPP_API_URL:}
      api-key: ${WHATSAPP_API_KEY:}
      sender: ${WHATSAPP_SENDER:}
    sms:
      provider: ${SMS_PROVIDER:disabled}
      api-url: ${SMS_API_URL:}
      api-key: ${SMS_API_KEY:}
      sender: ${SMS_SENDER:}
    email:
      provider: ${EMAIL_PROVIDER:disabled}
    retry:
      max-attempts: 5
      initial-delay-seconds: 60
  backup:
    enabled: ${BACKUP_ENABLED:true}
    cron: ${BACKUP_CRON:0 30 1 * * *}
    retention-days: ${BACKUP_RETENTION_DAYS:30}
    mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}
    mysql-path: ${MYSQL_PATH:mysql}

logging:
  level:
    root: INFO
    com.garmentshop.erp: INFO
    org.springframework.security: WARN
  file:
    name: ./data/logs/garment-erp.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/db/garmenterp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-9f4b2d7c1a8e6f3b5c0d9e2a7f4b1c8d6e3a0f9b2c5d8e1f4a7b0c3d6e9f2a5b}
  demo-data: ${DEMO_DATA:true}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:garmenterp-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-9f4b2d7c1a8e6f3b5c0d9e2a7f4b1c8d6e3a0f9b2c5d8e1f4a7b0c3d6e9f2a5b}
  demo-data: false
  backup:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:garment_erp}?useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:garment}
    password: ${DB_PASSWORD:garment}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: prod
  h2:
    console:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    # Fail fast: production must provide a strong, unique secret.
    secret: ${JWT_SECRET}
  cors:
    # Fail fast: production must declare the allowed frontend origin(s).
    allowed-origins: ${CORS_ORIGINS}
  demo-data: false
